name: Build and release AgentBridge
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            python: backend/.venv/bin/python
          - os: ubuntu-22.04
            platform: linux-x86_64
            python: backend/.venv/bin/python
          - os: windows-latest
            platform: windows-x86_64
            python: backend/.venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/set-release-version.py "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@v5
      - run: cd backend && uv sync --python 3.12 --inexact
      - run: uv pip install --python '${{ matrix.python }}' 'pyinstaller>=6,<7'
      - run: cd frontend && npm ci && npm run build
      - if: runner.os == 'macOS'
        run: ./menubar/build.sh
      - run: '"${{ matrix.python }}" -m pytest backend/tests/test_cli_manager.py backend/tests/test_tray.py backend/tests/test_updates.py backend/tests/test_autostart.py -q'
      - run: '"${{ matrix.python }}" scripts/build-release.py'
      - run: '"${{ matrix.python }}" scripts/smoke-release.py'
      - run: '"${{ matrix.python }}" scripts/archive-release.py "${{ matrix.platform }}"'
      - uses: actions/upload-artifact@v4
        with:
          name: agentbridge-${{ matrix.platform }}
          path: build/artifacts/*
          if-no-files-found: error
  verify:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agentbridge-*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "AgentBridge $GITHUB_REF_NAME" --generate-notes --verify-tag

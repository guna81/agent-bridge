name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: proxy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --all-extras
      - name: Tests (SQLite, in-process queue)
        run: uv run pytest -q
      - name: Tests (Postgres, Redis queue)
        env:
          PROXY_DATABASE_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/proxy
          PROXY_QUEUE_BACKEND: redis
          PROXY_REDIS_URL: redis://127.0.0.1:6379/1
          REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build


  windows-cli:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - name: CLI and tray tests
        run: uv run pytest tests/test_cli_manager.py tests/test_tray.py tests/test_autostart.py -q

[project]
name = "llm-cli-gateway"
version = "0.2.0"
description = "OpenAI- and Anthropic-compatible gateway that wraps coding CLI agents (claude, codex, agy, gemini) as subprocesses"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "cryptography>=42",
  "httpx>=0.27",
  "jsonpath-ng>=1.6",
  "psutil>=6",
  "pystray>=0.19.5; sys_platform != 'darwin'",
  "pillow>=10; sys_platform != 'darwin'",
]

[project.optional-dependencies]
redis = [
    "redis>=5",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "openai>=1.40",
  "fakeredis>=2.40.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real: runs the real installed CLIs (needs RUN_REAL_CLI=1)"]

[tool.setuptools.packages.find]
include = ["app*"]
